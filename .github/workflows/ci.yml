name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: Contract + validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json
      # The repo root now carries dev-only tooling (ESLint, TypeScript). None of
      # it is needed to *run* the skill — see the portability check below — but
      # linting and type-checking need it installed.
      - run: npm ci
      # extension/src is covered by both `eslint .` (typed linting) and the
      # fourth typecheck project, whose `types: ["node", "vscode"]` resolves
      # @types/vscode from extension/node_modules. Without this the contract job
      # fails with TS2688 and a few hundred no-unsafe-* errors on error-typed
      # vscode values.
      - name: Install extension dev deps (lint and typecheck reach extension/src)
        run: npm ci
        working-directory: extension
      - name: Lint
        run: npm run lint
      - name: Type-check (all four projects)
        run: npm run typecheck
      - name: Validator + CLI tests
        run: npm test
      - name: Portability check (skill runs standalone, no node_modules)
        # Copies the skill the way a consumer would and runs it with nothing
        # installed, so a dev-only dependency can never sneak into the runtime
        # path. Exercises the CLI entrypoint too, not just the validator.
        run: |
          cp -r .claude/skills/chapter-review "$RUNNER_TEMP/skill"
          cd "$RUNNER_TEMP/skill"
          test ! -e node_modules || (echo "node_modules leaked into the skill" && exit 1)
          node validate.ts example-chapters.json
          node chapter-review --help
          ./chapter-review --help

  extension:
    name: Extension build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - name: Type-check and compile
        run: npm run compile
      - name: Extension unit tests (no editor needed)
        run: npm test
      # The tree provider and activation need the real vscode API, so these run
      # inside a downloaded VS Code. It is an Electron app with no headless mode,
      # hence xvfb; on Windows the same command opens a window for a few seconds.
      - name: Extension host tests (real VS Code under xvfb)
        run: xvfb-run -a npm run test:host
      - name: Package .vsix (build verification)
        run: npm run package
      - name: The .vsix must ship a runnable skill
        # `.vscodeignore` excludes `**/*.ts` for the extension's own sources, but
        # the bundled skill's TypeScript *is* its runtime form. Getting this wrong
        # produces a .vsix whose "Install Skill" reports success and then fails
        # with ERR_MODULE_NOT_FOUND, and only on the Marketplace path — the
        # release-zip path is packaged separately and would still work. Assert on
        # the real package contents, then run what it would install.
        run: |
          npx vsce ls --no-dependencies > /tmp/vsix-files.txt
          for f in main.ts validate.ts cmd-write.ts manifest.ts diff.ts git.ts flags.ts util.ts types.ts chapter-review package.json; do
            grep -qx "skill/$f" /tmp/vsix-files.txt || { echo "MISSING from .vsix: skill/$f"; exit 1; }
          done
          rm -rf /tmp/vsix-skill && mkdir -p /tmp/vsix-skill
          while read -r f; do
            case "$f" in skill/*) mkdir -p "/tmp/vsix-skill/$(dirname "${f#skill/}")"; cp "$f" "/tmp/vsix-skill/${f#skill/}";; esac
          done < /tmp/vsix-files.txt
          node /tmp/vsix-skill/chapter-review --help
          node /tmp/vsix-skill/validate.ts /tmp/vsix-skill/example-chapters.json

  # Every push to main that is not a stable release publishes a pre-release, so
  # anyone opted into the pre-release channel tracks main. Gated on both jobs
  # above: nothing reaches the Marketplace that CI has not passed.
  pre-release:
    name: Publish pre-release
    needs: [contract, extension]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Shared with release.yml so the two lanes never publish concurrently.
    concurrency:
      group: marketplace-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the pre-release patch is the commit count. Tags: the
          # stable-lane guard below reads them.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Skip commits that belong to the stable lane
        id: lane
        run: |
          # A commit that moves the version is preparing a stable release, and its
          # tag often arrives as a separate push, so waiting for a tag would
          # publish a pre-release built from the release commit itself.
          read_version() { node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version"; }
          prev=$(git show HEAD~1:extension/package.json 2>/dev/null | read_version 2>/dev/null || true)
          curr=$(node -p "require('./extension/package.json').version")
          if [ -n "$prev" ] && [ "$prev" != "$curr" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=the version moved $prev -> $curr, so this is a release commit" >> "$GITHUB_OUTPUT"
          elif tag=$(git describe --exact-match --tags HEAD 2>/dev/null); then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=HEAD is tagged $tag" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report the skip
        if: steps.lane.outputs.skip == 'true'
        run: |
          echo "::notice::No pre-release published: ${{ steps.lane.outputs.reason }}"

      # publish-version.ts asks the Marketplace what is already published, via the
      # vsce in extension/node_modules.
      - name: Install
        if: steps.lane.outputs.skip != 'true'
        working-directory: extension
        run: npm ci

      - name: Decide the version
        if: steps.lane.outputs.skip != 'true'
        id: version
        run: |
          # Assigned, not echoed inline: `echo "v=$(cmd)"` swallows a non-zero exit
          # and would hand the publish an empty version.
          VERSION=$(node scripts/publish-version.ts prerelease)
          test -n "$VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to VS Code Marketplace
        if: steps.lane.outputs.skip != 'true'
        working-directory: extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          # Uncommitted, and the checkout is throwaway; vsce packages what it reads
          # from package.json.
          npm version "${{ steps.version.outputs.value }}" --no-git-tag-version --allow-same-version
          # Deliberately no --skip-duplicate: a duplicate has to fail loudly, which
          # is what the check in publish-version.ts exists for.
          npx vsce publish --pre-release --no-dependencies
