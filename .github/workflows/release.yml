name: Release

# Tag a release (vX.Y.Z) to build the .vsix and the skill bundle and attach
# them to a GitHub Release. The /release skill cuts the tag; this publishes it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Shared with the pre-release job in ci.yml, so a stable publish and a
    # pre-release publish can never write to the Marketplace at the same time.
    # `git push --follow-tags` fires both workflows from one command.
    concurrency:
      group: marketplace-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          # publish-version.ts reads every v* tag to rule out a release that would
          # land below one already cut. A tag-triggered checkout carries only its
          # own ref by default.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json

      # Before the version check: publish-version.ts asks the Marketplace what is
      # already published, via the vsce in extension/node_modules.
      - name: Install
        working-directory: extension
        run: npm ci

      - name: Version must match the tag, sit on an even minor, and be unpublished
        run: node scripts/publish-version.ts stable "$GITHUB_REF_NAME"

      - name: Changelog must have an entry for this version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if ! grep -qE "^## \[${VERSION//./\\.}\]" extension/CHANGELOG.md; then
            echo "::error::extension/CHANGELOG.md has no '## [$VERSION]' section — update the changelog before tagging"
            exit 1
          fi

      - name: Build .vsix
        working-directory: extension
        run: npm run package

      - name: Bundle the skill
        run: |
          cd .claude/skills
          zip -r "$GITHUB_WORKSPACE/chapter-review-skill.zip" chapter-review \
            -x "chapter-review/node_modules/*" "chapter-review/tsconfig.json" "chapter-review/package-lock.json"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              extension/*.vsix \
              chapter-review-skill.zip \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              extension/*.vsix \
              chapter-review-skill.zip
          fi

      - name: Publish to VS Code Marketplace
        working-directory: extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          version=$(node -p "require('./package.json').version")

          on_marketplace() {
            curl -s -X POST \
              'https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery' \
              -H 'Accept: application/json;api-version=3.0-preview.1' \
              -H 'Content-Type: application/json' \
              -d '{"filters":[{"criteria":[{"filterType":7,"value":"kevinboss.chapter-review"}]}],"flags":16}' \
              | grep -q "\"version\":\"$version\""
          }

          for attempt in 1 2 3; do
            echo "::group::publish attempt $attempt"
            npx vsce publish --no-dependencies && exit 0
            echo "::endgroup::"
            on_marketplace && exit 0
            sleep 30
          done

          echo "::error::$version did not reach the Marketplace after 3 attempts"
          exit 1
